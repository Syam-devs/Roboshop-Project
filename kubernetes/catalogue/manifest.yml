apiVersion: v1 
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    purpose: catalogue
    project: roboshop
    tier: app
data:
  MONGO: true
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
---

apiVersion: tiers/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    purpose: catalogue
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      purpose: catalogue
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        purpose: catalogue
        project: roboshop
        tier: app
    spec:
      containers:
      - name: catalogue
        image: syam/mongdb:v1
        envFrom:
        - ConfigMapRef:
            name: catalogue

---
apiVersion: v1 
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    purpose: catalogue
    project: roboshop
    tier: app
spec:
  selector:
    purpose: catalogue
    project: roboshop
    tier: app
  ports:
  - Protocol: TCP
    port: 8080
    targetPort: 8080

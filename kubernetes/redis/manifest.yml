apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
  labels:
    purpose: redis
    project: roboshop
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      purpose: redis
      project: roboshop
      app: database
  template:
    metadata:
      labels:
        purpose: redis
        project: roboshop
        app: database
    spec:
      containers:
      - name: redis
        image: redis:7.0

---
apiVersion: v1 
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    purpose: redis
    project: roboshop
    app: database
spec:
  selector:
    purpose: redis
    project: roboshop
    app: database
  ports:
  - Protocol: TCP
    port: 6379
    targetPort: 6379


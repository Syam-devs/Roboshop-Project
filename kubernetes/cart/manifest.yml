apiVersion: v1 
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
  labels:
    purpose: cart
    project: roboshop
    tier: app
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---

apiVersion: tiers/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  labels:
    purpose: cart
    project: roboshop
    tier: app
spec:
  replicas: 1
  selector:
    matchLabels:
      purpose: cart
      project: roboshop
      tier: app
  template:
    metadata:
      labels:
        purpose: cart
        project: roboshop
        tier: app
    spec:
      containers:
      - name: cart
        image: syam/mongdb:v1
        envFrom:
        - ConfigMapRef:
            name: cart

---
apiVersion: v1 
kind: Service
metadata:
  name: cart
  namespace: roboshop
  labels:
    purpose: cart
    project: roboshop
    tier: app
spec:
  selector:
    purpose: cart
    project: roboshop
    tier: app
  ports:
  - Protocol: TCP
    port: 8080
    targetPort: 8080
